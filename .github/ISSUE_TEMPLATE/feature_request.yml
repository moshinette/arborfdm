name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation (model type, printer, slicer) rather than only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you tried
  - type: textarea
    id: context
    attributes:
      label: Screenshots, prints, references
      description: Photos of real prints are very useful. Do not attach models you are not allowed to share.

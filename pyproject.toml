[build-system]
# >=77: SPDX "license" string and "license-files" (PEP 639); >=78.1.1: PYSEC-2025-49 fixed
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "arborfdm"
dynamic = ["version"]                       # single source: arbor/__init__.py
description = "Hybrid tree support generator for FDM miniatures"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
# 3.10.0 crashes PyInstaller (bug in its "dis" module); manifold3d has no wheel for 3.15+
# (a source build needs TBB). Remove the upper bound once manifold3d publishes 3.15 wheels.
requires-python = ">=3.12,<3.15"
keywords = ["3d-printing", "fdm", "supports", "tree-supports", "miniatures", "3mf", "stl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
# Minimum versions: the oldest that pass the test suite (checked 2026-10-15 on Python 3.12,
# see docs/PACKAGING.md). trimesh < 4.5 calls manifold3d's removed Manifold.from_mesh and
# needs mapbox_earcut to extrude polygons (both used by the tests), manifold3d < 3.4 fails
# some unions (InvalidConstruction), pyqtgraph < 0.14 lacks
# GLViewWidget.projectionMatrix(region, viewport). No upper bounds: the release build pins
# exact versions with packaging/requirements-build.txt instead.
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11.2",
  "trimesh>=4.5",
  "manifold3d>=3.4",
  "shapely>=2.0.2",
  "networkx>=3.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "pyqtgraph>=0.14", "PyOpenGL>=3.1.5"]
# lxml: trimesh reads 3MF in the tests (>=6.1: PYSEC-2026-87, XXE); rtree: trimesh proximity
# and ray queries in the tests; pytest >=9.0.3: PYSEC-2026-1845
dev = ["pytest>=9.0.3", "pyinstaller>=6", "lxml>=6.1", "rtree>=1.1"]

# Uncomment and fill in once the GitHub repository exists:
# [project.urls]
# Homepage = "https://github.com/OWNER/arborfdm"
# Issues = "https://github.com/OWNER/arborfdm/issues"
# Changelog = "https://github.com/OWNER/arborfdm/blob/main/CHANGELOG.md"

[project.scripts]
arborfdm-cli = "arbor.cli:main"

[project.gui-scripts]
arborfdm = "arbor.app.main:main"

[tool.setuptools.dynamic]
version = {attr = "arbor.__version__"}

[tool.setuptools.packages.find]
include = ["arbor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long running tests (large meshes, benchmarks)", "gui: needs Qt"]
